<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <title>Kirayedar24 - Property Management</title>
    <meta name="description" content="Complete property management solution for buying, selling and renting properties" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#FDB022" />

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            color: #FDB022;
            margin-bottom: 20px;
        }

        .subtitle {
            color: #64748B;
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-button {
            display: inline-block;
            padding: 12px 24px;
            background: #FDB022;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 2px solid #FDB022;
        }

        .link-button:hover {
            background: #E6A019;
            border-color: #E6A019;
            transform: translateY(-2px);
        }

        .link-button.secondary {
            background: transparent;
            color: #FDB022;
        }

        .link-button.secondary:hover {
            background: #FDB022;
            color: white;
        }

        .footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #64748B;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            .logo {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Kirayedar24</div>
        <div class="subtitle">
            Complete property management solution for buying, selling and renting properties
        </div>

        <div class="links">
            <a href="/privacy-policy" class="link-button secondary">
                Privacy Policy
            </a>
            <a href="/delete-account" class="link-button secondary">
                Delete Account
            </a>
        </div>

        <div class="footer">
            © 2024 Kirayedar24. All rights reserved.
        </div>
    </div>
</body>
</html>
